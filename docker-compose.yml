services:

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
    volumes:
      - ./docker/etcd:/etcd
    command: >
      etcd
      --advertise-client-urls=http://0.0.0.0:2379
      --listen-client-urls=http://0.0.0.0:2379


  minio:
    container_name: milvus-minio
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./docker/minio:/minio_data
    command:
      minio server /minio_data


  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.0

    command:
      - milvus
      - run
      - standalone

    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000

    ports:
      - "19530:19530"
      - "9091:9091"

    volumes:
      - ./docker/milvus:/var/lib/milvus

    depends_on:
      - etcd
      - minio


  postgres:
    container_name: work-postgres
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: work_agent
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d work_agent"]
      interval: 5s
      timeout: 5s
      retries: 10


  work-minio:
    container_name: work-minio
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - ./docker/work-minio:/minio_data
    command: server /minio_data --console-address :9001