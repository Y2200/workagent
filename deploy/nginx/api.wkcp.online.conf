# ==========================================
# P6-1 Nginx：api.wkcp.online（API 直连入口）
# 安装：cp 到 /etc/nginx/conf.d/api.wkcp.online.conf 后 nginx -t && reload
#
# 证书：certbot --nginx -d wkcp.online -d api.wkcp.online
#       （单证书覆盖两域，路径 live/wkcp.online/）
# ==========================================

# HTTP → HTTPS 301 跳转
server {
    listen 80;
    server_name api.wkcp.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.wkcp.online;

    # Let's Encrypt（certbot 签发，单证书覆盖两域）
    ssl_certificate     /etc/letsencrypt/live/wkcp.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wkcp.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options nosniff always;

    # 全量代理到后端（后端容器仅回环 127.0.0.1:8000）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 公网存活探针
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
