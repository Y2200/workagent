# ==========================================
# 容器内 Nginx：api.wkcp.online（API 直连入口）
#
# 本文件随 frontend 镜像发布（Dockerfile.frontend: COPY deploy/nginx/conf.d/ → /etc/nginx/conf.d/）
# 用途：企业微信回调、外部系统直连 API（全量反代 backend 容器）
#
# 注意：conf.d 按文件名字母序加载，"api.*" 先于 "wkcp.*"，
#      因此本文件的 :80 server 是默认 server —— healthz 必须在这里也定义。
# 证书：同上，单证书覆盖两域（/opt/work-agent/certbot/conf）
# ==========================================

# HTTP → HTTPS 301（保留 ACME 校验与容器健康检查）
#
# 注：跳转用 `location /` 而非 server 级 `return`（理由见 wkcp.online.conf 同处注释）
server {
    listen 80;
    server_name api.wkcp.online;

    # 容器健康检查入口（默认 server，compose healthcheck 打这里）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.wkcp.online;

    ssl_certificate     /etc/letsencrypt/live/wkcp.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wkcp.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options nosniff always;

    # 全量代理到后端容器
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 公网存活探针
    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }
}
