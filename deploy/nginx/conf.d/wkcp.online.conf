# ==========================================
# 容器内 Nginx：wkcp.online（前端 dist + API 代理）
#
# 本文件随 frontend 镜像发布（Dockerfile.frontend: COPY deploy/nginx/conf.d/ → /etc/nginx/conf.d/）
# 容器角色 = Web 入口：TLS 终止 + 前端静态托管 + /api 反代后端容器
#
# 证书：宿主机卷 /opt/work-agent/certbot/conf 挂到 /etc/letsencrypt（只读）
#      单证书覆盖 wkcp.online + api.wkcp.online
# 后端：同 Docker 网络内服务名 backend:8000（后端不再向宿主机发布端口）
# ==========================================

# HTTP → HTTPS 301（保留 ACME 校验与容器健康检查）
#
# 注：跳转用 `location /` 而不是 server 级 `return`，是为了让优先级**无歧义**：
#     精确匹配 `location = /healthz` 与更长的前缀 `/.well-known/acme-challenge/`
#     必然优先于 `location /`，不依赖 server 级 return 与 location 的求值顺序。
server {
    listen 80;
    server_name wkcp.online;

    # 容器健康检查入口（compose healthcheck 直连 :80，不走 HTTPS）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # certbot webroot 校验（与宿主机 /opt/work-agent/certbot/www 共享卷）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name wkcp.online;

    ssl_certificate     /etc/letsencrypt/live/wkcp.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wkcp.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 前端静态产物（镜像内 dist）
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # API 代理（后端容器，Docker 内部网络）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 公网存活探针（仅返回 /health，不泄露内部信息）
    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }
}
