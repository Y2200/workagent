# ==========================================
# 容器内 Nginx 主配置（覆盖 nginx:alpine 默认 /etc/nginx/nginx.conf）
#
# 与宿主机部署版本的差异：
#   - 日志走容器 stdout/stderr，统一由 docker logs / json-file 轮转收集
#   - server_tokens off：不对外暴露 nginx 版本
#   - client_max_body_size 50m：知识库文档上传（PDF/Word），默认 1MB 会 413
#   - 站点配置在 /etc/nginx/conf.d/*.conf（随镜像发布）
# ==========================================

user  nginx;
worker_processes  auto;

error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # 知识库文档上传上限（nginx 默认 1m）
    client_max_body_size 50m;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
