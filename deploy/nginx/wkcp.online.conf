# ==========================================
# P6-1 Nginx：wkcp.online（前端 + API 代理）
# 安装：cp 到 /etc/nginx/conf.d/wkcp.online.conf 后 nginx -t && reload
#
# 证书：certbot --nginx -d wkcp.online -d api.wkcp.online
#       （单证书覆盖两域，路径 live/wkcp.online/）
# ==========================================

# HTTP → HTTPS 301 跳转
server {
    listen 80;
    server_name wkcp.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name wkcp.online;

    # Let's Encrypt（certbot 签发）
    ssl_certificate     /etc/letsencrypt/live/wkcp.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wkcp.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 前端静态（npm run build 产物）
    root /opt/work-agent/frontend/dist;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # API 代理（后端容器仅回环 127.0.0.1:8000）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 公网存活探针（仅返回 /health，不泄露内部信息）
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
