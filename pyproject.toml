[project]
name = "work-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10,<4",
    "bcrypt>=4.0",
    "celery==5.4.0",
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "langchain==1.2.7",
    "langchain-openai>=1.4.1",
    "langgraph==1.0.7",
    "loguru==0.7.3",
    "minio>=7.2",
    "psycopg2-binary>=2.9",
    "pydantic-settings==2.8.1",
    "PyJWT>=2.8",
    "pymilvus>=3.0.1",
    "pypdf==5.3.0",
    "python-docx==1.1.2",
    "python-dotenv==1.0.1",
    "python-multipart>=0.0.9",
    "redis==5.2.1",
    "requests>=2.34.2",
    "sentence-transformers==3.4.1",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]==0.34.0",
]

[project.scripts]
work-agent = "work_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
